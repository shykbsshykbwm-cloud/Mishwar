<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8A1538">
<title>مشوار - Mishwar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--m:#8A1538;--m2:#5e0e27;--g:#C9A24B;--bg:#f5f2f3;--tx:#1d1418;--mut:#7b6d73;--ok:#1f9d55;--rd:#d93a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Tajawal',system-ui,sans-serif;color:var(--tx);background:var(--bg);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0}
input,select{font-family:inherit;font-size:16px}
h3,h4{margin:8px 0}
.mut{color:var(--mut)}.sm{font-size:13px}.c{text-align:center}
[hidden]{display:none!important}
/* auth */
#auth{position:fixed;inset:0;overflow:auto;background:linear-gradient(160deg,var(--m) 0%,var(--m2) 75%);display:flex;justify-content:center;align-items:flex-start;padding:18px 12px;z-index:3000}
.card{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:440px;box-shadow:0 20px 50px #0005}
.card label,.mbox label{display:block;font-weight:700;margin:10px 0 4px;font-size:14px}
.card input,.mbox input{width:100%;padding:12px;border:2px solid #eadfe3;border-radius:12px;outline:0;background:#fff}
.card input:focus,.mbox input:focus{border-color:var(--m)}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chips button{padding:6px 12px;border-radius:20px;background:#f1e9ec;font-weight:700}
.chips button.on{background:var(--m);color:#fff}
.tabs{display:flex;background:#f1e9ec;border-radius:14px;padding:4px;margin:8px 0}
.tabs button{flex:1;padding:10px;border-radius:11px;background:transparent;font-weight:800;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--m);box-shadow:0 2px 6px #0002}
.err{color:var(--rd);font-weight:700;min-height:20px;margin-top:8px;text-align:center}
.demo{background:#fff6dd;border:1px solid var(--g);border-radius:12px;padding:8px 10px;font-size:12.5px;margin-top:12px}
.pv{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#eee}
.upl{display:flex;align-items:center;gap:10px;margin-top:6px}
/* main */
#main{position:fixed;inset:0}
#top{position:absolute;top:0;inset-inline:0;height:56px;background:var(--m);color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:1100;box-shadow:0 2px 10px #0004}
.logo{font-weight:900;font-size:18px;white-space:nowrap}
.mode{display:flex;background:#0003;border-radius:20px;padding:3px}
.mode button{background:transparent;color:#fff;padding:6px 14px;border-radius:17px;font-weight:800}
.mode button.on{background:#fff;color:var(--m)}
#top select{background:#fff2;color:#fff;border:0;border-radius:10px;padding:6px;font-weight:700}
#top select option{color:#000}
.av{width:38px;height:38px;border-radius:50%;padding:0;overflow:hidden;background:#fff;border:2px solid var(--g);flex:none}
.av img{width:100%;height:100%;object-fit:cover}
#map{position:absolute;top:56px;bottom:0;inset-inline:0}
#navchip{position:absolute;top:66px;inset-inline-start:10px;z-index:1010;background:#fff;border-radius:20px;padding:7px 13px;font-weight:800;font-size:13px;box-shadow:0 2px 8px #0003;color:var(--m)}
#pickb{position:absolute;top:104px;inset-inline:0;margin:auto;width:max-content;max-width:90%;z-index:1010;background:var(--g);color:#000;border-radius:20px;padding:7px 14px;font-weight:800;box-shadow:0 2px 8px #0003}
#sheet{position:absolute;bottom:0;inset-inline:0;z-index:1050;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px #0003;max-height:62vh;overflow:auto;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
.grab{width:42px;height:4px;background:#ddd;border-radius:9px;margin:0 auto 10px}
.fld{display:flex;align-items:center;gap:8px;background:#f4eff1;border-radius:14px;padding:5px 10px;margin-bottom:8px;min-height:46px}
.fld input{flex:1;border:0;background:transparent;outline:0;min-width:0;padding:6px 0}
.fv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d{width:12px;height:12px;border-radius:50%;flex:none}.d.g{background:var(--ok)}.d.r{background:var(--rd)}
.ib{background:#fff;border-radius:10px;width:36px;height:36px;font-size:17px;box-shadow:0 1px 3px #0002;flex:none}
.rs{padding:10px;border-bottom:1px solid #eee;font-size:14px;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--m);color:#fff;font-weight:800;font-size:17px;margin-top:6px;display:block;text-align:center}
.btn.g{background:var(--ok)}.btn.o{background:#fff;color:var(--m);border:2px solid var(--m)}.btn.r{background:var(--rd)}.btn.wa{background:#25D366}
.btn:disabled{opacity:.4}.btn.s{padding:9px;font-size:14px;width:auto;display:inline-block}
.row{display:flex;gap:8px;align-items:stretch}
.kpi{flex:1;background:#faf6f7;border-radius:14px;padding:9px 4px;text-align:center;font-size:12.5px;color:var(--mut)}
.kpi b{display:block;font-size:18px;color:var(--m)}
.drv{display:flex;gap:10px;align-items:center;padding:8px;border:2px solid #eee;border-radius:14px;margin-bottom:6px;cursor:pointer}
.drv.sel{border-color:var(--m);background:#fff5f8}
.drv img,.pimg{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.box{background:#faf6f7;border-radius:14px;padding:10px;margin:8px 0;line-height:1.9}
.meter{font-size:46px;font-weight:900;color:var(--m);text-align:center;direction:ltr;line-height:1.1}
.pill{padding:4px 12px;border-radius:20px;background:#eee;font-weight:800;font-size:13px}.pill.on{background:#d6f5e3;color:var(--ok)}
.due{display:flex;justify-content:space-between;align-items:center;background:#fff3d6;border:1px solid var(--g);border-radius:14px;padding:10px 12px;margin:8px 0}
.due b{font-size:20px;color:var(--m)}
.plate{display:inline-block;background:#fff;border:2px solid #222;border-radius:8px;padding:2px 12px;font-weight:900;letter-spacing:1px;direction:ltr}
.spin{width:38px;height:38px;border:5px solid #eee;border-top-color:var(--m);border-radius:50%;animation:sp 1s linear infinite;margin:12px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.stars{display:flex;justify-content:center;gap:4px;direction:ltr}
.stars span{font-size:38px;color:#ddd;cursor:pointer}.stars span.on{color:var(--g)}
.mk{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--m);font-size:18px;box-shadow:0 2px 6px #0004}
.mk.me{width:18px;height:18px;background:#2a7be4;border:3px solid #fff;box-shadow:0 0 0 4px #2a7be466}
.mk.car{border-color:var(--g)}.mk.pk{border-color:var(--ok)}.mk.ds{border-color:var(--rd)}
/* modal */
#modal{position:fixed;inset:0;background:#0007;z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:#fff;border-radius:22px 22px 0 0;padding:16px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
@media(min-width:600px){#modal{align-items:center}.mbox{border-radius:22px}}
#toast{position:fixed;bottom:90px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:5000;display:none;text-align:center}
.ph{display:flex;align-items:center;gap:12px}
@media(max-width:430px){.logo span{display:none}}
</style>
</head>

</div>
<div id="modal" hidden></div>

const DB=(()=>{
  let rp=null;
  const fresh=async()=>{if(!AUTH.ref||!AUTH.tok)throw new Error('noauth');if(Date.now()>AUTH.exp-120000){rp=rp||fbRefresh().finally(()=>{rp=null});await rp}};
  const CANDS=['https://mishwar-8779b-default-rtdb.firebaseio.com','https://mishwar-8779b-default-rtdb.europe-west1.firebasedatabase.app','https://mishwar-8779b-default-rtdb.asia-southeast1.firebasedatabase.app'];
  const raw=(base,m,p,b)=>fetch(`${base}/${p}.json?auth=${AUTH.tok}`,{method:m,body:b===undefined?undefined:JSON.stringify(b)});
  async function f(m,p,b){
    await fresh();
    let r=await raw(FB.db,m,p,b).catch(()=>null);
    if(!r||r.status===404){   // رابط/منطقة قاعدة البيانات غير صحيحة: جرّب باقي المناطق وثبّت الصحيح
      for(const c of CANDS){if(c===FB.db)continue;const x=await raw(c,m,p,b).catch(()=>null);if(x&&x.status!==404){FB.db=c;r=x;break}}
    }
    if(!r)throw new Error('Failed to fetch');
    if(!r.ok)throw new Error('db '+r.status);
    return r.json();
  }
  return{cloud:true,get:p=>f('GET',p),set:(p,v)=>f('PUT',p,v),patch:(p,v)=>f('PATCH',p,v),del:p=>f('DELETE',p)};
})();

function authErr(m){
  if(/EMAIL_EXISTS/.test(m))return t('emailUsed');
  if(/WEAK_PASSWORD/.test(m))return t('badPass');
  if(/INVALID_EMAIL/.test(m))return t('badEmail');
  if(/INVALID_LOGIN|EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_CREDENTIAL/.test(m))return t('badLogin');
  if(/OPERATION_NOT_ALLOWED/.test(m))return 'فعّل Email/Password في Firebase Authentication';
  if(/TOO_MANY/.test(m))return 'محاولات كثيرة، انتظر قليلاً';
  if(/db 40[13]/.test(m))return 'خطأ صلاحيات قاعدة البيانات ('+m+'): تأكد من نشر القواعد (Publish) في Realtime Database > Rules';
  if(/db 404|Failed to fetch|NetworkError|Load failed/i.test(m))return 'تعذر الوصول لقاعدة البيانات ('+m+'): تأكد أنك أنشأت Realtime Database وأن رابطها في FB.db صحيح';
  if(/API_KEY|API key|PERMISSION_DENIED|referer/i.test(m))return 'مفتاح Firebase مرفوض ('+m+'): افحص قيود مفتاح API في Google Cloud';
  return t('netErr')+' ['+m+']';
}
async function doRegister(){
  try{
    const v=id=>($('#'+id)?$('#'+id).value.trim():'');
    const email=v('r_email').toLowerCase(),pass=$('#r_pass').value,name=v('r_name'),phone=normPhone(v('r_phone')),drv=AR==='driver';
    if(!name||!v('r_phone')||!email||!pass)return aerr(t('fillAll'));
    if(!/^[^\s@'"<>]+@[^\s@'"<>]+\.[^\s@'"<>]+$/.test(email))return aerr(t('badEmail'));
    if(pass.length<6)return aerr(t('badPass'));
    if(!phone)return aerr(t('badPhone'));
    if(drv&&(!v('r_plate')||!AP.me||!AP.car))return aerr(t('fillAll'));
    try{await fbSign('signUp',email,pass)}catch(e){
      if(/EMAIL_EXISTS/.test(String(e.message))){
        try{await fbSign('signInWithPassword',email,pass)}catch(_){return aerr(t('emailUsed'))}
        if(await DB.get('users/'+AUTH.uid))return aerr(t('emailUsed'));   // مسجل كاملاً فعلاً
      }else throw e;
    }
    const id=AUTH.uid;
    const us={email,phone,isDriver:drv,createdAt:Date.now()};
    const pr={name,rSum:0,rCount:0};if(AP.me)pr.photo=AP.me;
    if(drv){pr.plate=v('r_plate').toUpperCase();pr.model=v('r_model');pr.carPhoto=AP.car}
    await DB.set('users/'+id,us);await DB.set('profiles/'+id,pr);
    S.mode=drv?'drive':'ride';S.user={...us,...pr,id};enter();
  }catch(e){aerr(authErr(String(e.message||e)))}
}
async function doLogin(){
  try{
    const email=$('#a_email').value.trim().toLowerCase(),pass=$('#a_pass').value;
    if(!email||!pass)return aerr(t('fillAll'));
    await fbSign('signInWithPassword',email,pass);
    const u=await loadUser(AUTH.uid);if(!u)return aerr('التسجيل غير مكتمل: اضغط "حساب جديد" وأدخل نفس البريد وكلمة السر لإكماله');
    S.user=u;enter();
  }catch(e){aerr(authErr(String(e.message||e)))}
}
async function logout(){try{if(D.online)await goOffline()}catch(e){}localStorage.removeItem('fbref');localStorage.removeItem('drvTrip');localStorage.removeItem('activeReq');location.reload()}

/* =====================  الدخول للتطبيق والخريطة  ===================== */
async function enter(){
  $('#auth').hidden=true;$('#main').hidden=false;closeModal();
  initMap();renderTop();startGeo();
  // استرجاع مشوار قيد التنفيذ
  try{
    const sv=JSON.parse(localStorage.getItem('drvTrip')||'null');
    if(sv&&sv.u===S.user.id){const q=await DB.get('requests/'+sv.req);if(q&&['accepted','arrived','started'].includes(q.status)){D.req=sv.req;D.phase=sv.phase;D.meter=sv.meter;D.q=q;D.online=true;S.mode='drive';restoreDrvMap(q)}}
    const ar=localStorage.getItem('activeReq');if(ar&&S.mode==='ride'){S.rider.req=ar;S.rider.phase='wait'}
  }catch(e){}
  if(!S.user.isDriver)S.mode='ride';
  renderTop();renderSheet();
  if(S.user.isDriver)loadStats();
  if(!S.nav)navModal();
  if(location.hash==='#admin')DB.get('admins/'+S.user.id).then(v=>{if(v)adminShow();else toast('⛔ غير مصرح')}).catch(()=>toast('⛔ غير مصرح'));
  clearInterval(enter.iv);enter.iv=setInterval(tick,3000);
}
function initMap(){
  if(M.map)return;
  M.map=L.map('map',{zoomControl:false,minZoom:C.minZ,maxBounds:L.latLngBounds(C.b[0],C.b[1]).pad(.2),maxBoundsViscosity:.9}).setView(C.center,C.zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(M.map);
  L.control.zoom({position:'bottomleft'}).addTo(M.map);
  M.drv=L.layerGroup().addTo(M.map);
  M.map.on('click',e=>{if(S.mode==='ride'&&S.rider.phase==='plan')mapPick(e.latlng)});
}
const IC=(h,c='',s=34)=>L.divIcon({className:'',html:`<div class="mk ${c}">${h}</div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]});
function setMk(n,p,icon){if(!M.map)return;if(M.mk[n])M.mk[n].setLatLng(p).setIcon(icon);else M.mk[n]=L.marker(p,{icon}).addTo(M.map)}
function rmMk(n){if(M.mk[n]){M.map.removeLayer(M.mk[n]);delete M.mk[n]}}
function drawRoute(g){if(M.route)M.map.removeLayer(M.route);M.route=L.polyline(g,{color:'#8A1538',weight:5,opacity:.85}).addTo(M.map)}
function clearMap(){['pick','dst','car','riderpos'].forEach(rmMk);if(M.route){M.map.removeLayer(M.route);M.route=null}M.drv.clearLayers()}
function fit(pts){if(!pts.length)return;const h=$('#sheet').offsetHeight;M.map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[30,70],paddingBottomRight:[30,h+20],maxZoom:16})}
async function route(a,b){
  try{const c=new AbortController();setTimeout(()=>c.abort(),8000);
    const j=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson&alternatives=true`,{signal:c.signal})).json();
    if(j.routes&&j.routes[0]){const x=j.routes.reduce((m,r)=>r.distance<m.distance?r:m,j.routes[0]);/*أقصر طريق*/return{km:x.distance/1000,min:Math.max(1,Math.round(x.duration/60)),geom:x.geometry.coordinates.map(c=>[c[1],c[0]]),approx:false}}
  }catch(e){}
  const km=hav(a,b)*1.3;return{km,min:Math.max(1,Math.round(km/40*60)),geom:[[a.lat,a.lng],[b.lat,b.lng]],approx:true};
}
async function rev(lat,lng){try{const j=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=${lang}&lat=${lat}&lon=${lng}`)).json();return shortName(j.display_name)||ll(lat,lng)}catch(e){return ll(lat,lng)}}

/* ---- ملاحة خارجية ---- */
function navModal(){
  const o=[['here','navHere','🗺️'],['google','navGoogle','📍'],['waze','navWaze','🚙'],['petal','navPetal','🧭']];
  openModal(`<h3 class="c">${t('navTitle')}</h3><p class="c mut sm">${t('navHint')}</p>`+o.map(x=>`<button class="btn ${S.nav===x[0]?'':'o'}" onclick="setNav('${x[0]}')">${x[2]} ${t(x[1])}</button>`).join(''));
}
function setNav(n){S.nav=n;localStorage.setItem('nav',n);closeModal();renderNavChip()}
function renderNavChip(){const m={here:'navHere',google:'navGoogle',waze:'navWaze',petal:'navPetal'};const e=$('#navchip');e.textContent='🧭 '+t(m[S.nav||'here']);e.onclick=navModal}
function countryModal(){
  openModal(`<h3 class="c">${t('country')}</h3>`+Object.keys(COUNTRIES).map(k=>`<button class="btn ${C.code===k?'':'o'}" onclick="setCountry('${k}')">${COUNTRIES[k].flag} ${cname(k)}</button>`).join(''));
}
function tripActive(){return !!D.req&&D.phase!=='ended'||(!!S.rider.req&&['wait','active'].includes(S.rider.phase))}
async function setCountry(k,silent){
  if(!COUNTRIES[k])return;
  if(k===C.code&&localStorage.getItem('cc')===k){closeModal();return}
  if(S.user&&tripActive()){if(!silent)toast(t('busyTrip'));return}
  if(S.user&&D.online)await goOffline();
  CC=k;C=COUNTRIES[k];try{localStorage.setItem('cc',k)}catch(e){}
  closeModal();
  if(M.map){M.map.setMinZoom(C.minZ);M.map.setMaxBounds(L.latLngBounds(C.b[0],C.b[1]).pad(.2));M.map.setView(C.center,C.zoom);M.centered=false;clearMap()}
  if(!S.user){authView();return}
  const r=S.rider;Object.assign(r,{pickup:null,dest:null,route:null,qtext:'',sel:null,drivers:[]});
  if(S.mode==='ride')riderReset();
  renderTop();renderSheet();if(S.user.isDriver)loadStats();
  if(S.pos)onPos();
}
function offerSwitch(g){
  openModal(`<h3 class="c">${COUNTRIES[g].flag} ${t('detectQ')}: ${cname(g)}</h3><button class="btn" onclick="setCountry('${g}')">${t('switchTo')} ${cname(g)}</button><button class="btn o" onclick="closeModal()">${t('stay')}</button>`);
}
function openNav(lat,lng){
  const n=S.nav;if(!n||n==='here')return;
  if(n==='google')window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`,'_blank');
  else if(n==='waze')window.open(`https://waze.com/ul?ll=${lat},${lng}&navigate=yes`,'_blank');
  else if(n==='petal')window.open(`https://www.petalmaps.com/navigation/?daddr=${lat},${lng}&type=drive&coordinateType=0&utm_source=mishwar`,'_blank');   // الرابط الرسمي لـ Petal Maps
}
function freshPos(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(g=>{S.pos={lat:g.coords.latitude,lng:g.coords.longitude,acc:g.coords.accuracy,ts:Date.now()};res(S.pos)},()=>res(null),{enableHighAccuracy:true,timeout:2500,maximumAge:5000})})}

/* =====================  GPS  ===================== */
function startGeo(){
  if(!navigator.geolocation||startGeo.on)return;startGeo.on=true;
  navigator.geolocation.watchPosition(p=>{
    S.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,ts:Date.now()};onPos();
  },()=>{},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}
function onPos(){
  const p=S.pos;
  const g=guessCC(p.lat,p.lng);
  if(g&&g!==C.code&&!tripActive()){
    if(!localStorage.getItem('cc'))setCountry(g,true);                      // أول مرة: اختر دولة موقعك تلقائياً
    else if(S.user&&!S.askedCC&&$('#modal').hidden){S.askedCC=1;offerSwitch(g)}   // اختار دولة سابقاً وهو الآن في دولة أخرى: اسأله مرة
  }setMk('me',[p.lat,p.lng],IC('','me',18));
  if(!M.centered&&inQ(p.lat,p.lng)){M.centered=true;M.map.setView([p.lat,p.lng],14)}
  const r=S.rider;
  if(S.mode==='ride'&&r.phase==='plan'&&!r.pickup&&inQ(p.lat,p.lng))setPoint('pickup',p.lat,p.lng);
  if(D.phase==='started')meterTick(p);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(D.phase==='started')wake();if(S.user){freshPos().then(p=>{if(p)onPos()});tick()}});
let WL=null;async function wake(){try{if(navigator.wakeLock)WL=await navigator.wakeLock.request('screen')}catch(e){}}
function unwake(){try{WL&&WL.release()}catch(e){}WL=null}

/* =====================  الواجهة العامة  ===================== */
function renderTop(){
  const u=S.user;
  $('#top').innerHTML=`<div class="logo">🚖 <span>${t('app')}</span></div>
  ${u.isDriver?`<div class="mode"><button class="${S.mode==='ride'?'on':''}" onclick="setMode('ride')">${t('ride')}</button><button class="${S.mode==='drive'?'on':''}" onclick="setMode('drive')">${t('drive')}</button></div>`:''}
  <span style="flex:1"></span>
  <button class="av" title="${t('country')}" style="font-size:21px;line-height:34px" onclick="countryModal()">${C.flag}</button>
  <select onchange="setLang(this.value)">${[['ar','العربية'],['en','English'],['hi','हिन्दी'],['ur','اردو']].map(x=>`<option value="${x[0]}" ${lang===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>
  <button class="av" onclick="profileView()"><img src="${u.photo||PH}"></button>`;
  renderNavChip();
}
function renderSheet(){S.mode==='ride'?riderSheet():drvSheet()}
async function setMode(m){
  if(m===S.mode)return;
  if(D.req&&D.phase!=='ended'){toast(t('busyTrip'));return}
  if(S.mode==='drive'&&D.online)await goOffline();
  if(D.phase==='ended')resetDrv(true);
  S.mode=m;clearMap();
  if(m==='ride'){riderReset(true)}else{D.phase='idle';loadStats()}
  renderTop();renderSheet();
}
function openModal(h){const m=$('#modal');m.innerHTML=`<div class="mbox">${h}</div>`;m.hidden=false;m.onclick=e=>{if(e.target===m)closeModal()}}
function closeModal(){$('#modal').hidden=true}
let busyTick=false;
async function tick(){
  if(busyTick||!S.user)return;busyTick=true;
  try{if(S.user.isDriver&&(D.online||D.req))await driverTick();if(S.mode==='ride')await riderTick()}catch(e){console.warn(e)}
  busyTick=false;
}

/* =====================  الراكب  ===================== */
function riderReset(keep){
  const r=S.rider;localStorage.removeItem('activeReq');
  Object.assign(r,{phase:'plan',req:null,q:null,route:null,dest:null,qtext:'',stars:0,sel:null,drivers:[],sig:'',pickMode:null});
  if(!keep)clearMap();else clearMap();
  r.pickup=null;if(S.pos&&inQ(S.pos.lat,S.pos.lng))setPoint('pickup',S.pos.lat,S.pos.lng);
  $('#pickb').hidden=true;
}
function riderSheet(){
  const r=S.rider,el=$('#sheet');
  if(r.phase==='plan'){
    el.innerHTML=`<div class="grab"></div>
    <div class="fld"><span class="d g"></span><div class="fv" id="pk">${esc(r.pickup?r.pickup.name:t('pickup')+' — '+t('tapMap'))}</div><button class="ib" title="${t('myLoc')}" onclick="useMyLoc()">📍</button><button class="ib" title="${t('pickMap')}" onclick="pickMode('pickup')">🗺️</button></div>
    <div class="fld"><span class="d r"></span><input id="q" autocomplete="off" placeholder="${t('search')}" value="${esc(r.qtext)}" oninput="onQ(this.value)"><button class="ib" title="${t('pickMap')}" onclick="pickMode('dest')">🗺️</button></div>
    <div id="res"></div><div id="plan"></div>`;
    renderPlan();return;
  }
  const q=r.q;
  if(r.phase==='wait'){
    el.innerHTML=`<div class="grab"></div><div class="spin"></div><h3 class="c">${t('waiting')}</h3><button class="btn o" onclick="cancelReq()">${t('cancel')}</button>`;return;
  }
  if(r.phase==='declined'){
    el.innerHTML=`<div class="grab"></div><h3 class="c">⚠️ ${t('declined')}</h3><button class="btn" onclick="riderBack()">${t('back')}</button>`;return;
  }
  if(!q){el.innerHTML='';return}
  if(r.phase==='active'){
    const st={accepted:'accepted',arrived:'arrived',started:'started'}[q.status];
    el.innerHTML=`<div class="grab"></div><h3 class="c">${t(st)}</h3>
    <div class="box row" style="align-items:center"><img class="pimg" data-uid="${esc(q.driverId)}" src="${photoCache[q.driverId]||PH}">
      <div style="flex:1"><b>${esc(q.driverName)}</b><div class="mut sm" id="drat"></div><div>${esc(q.model||'')} <span class="plate">${esc(q.plate||'')}</span></div></div></div>
    <div class="row"><a class="btn s" style="flex:1;background:var(--ok);text-decoration:none" href="tel:+${esc(q.driverPhone)}">📞 ${t('call')}</a><a class="btn s wa" style="flex:1;text-decoration:none" target="_blank" href="${waLink(q.driverPhone,'')}">💬 ${t('whatsapp')}</a></div>
    ${q.status==='started'?`<div class="box"><div class="c mut sm">${t('meter')}</div><div class="meter" id="lf">${money(q.fare||q.estFare)} ${t('qar')}</div><div class="c mut sm" id="lk">${(q.meterKm||0).toFixed(2)} ${t('km')}</div><div class="c mut sm" style="margin-top:6px">${t('shortNote')}</div></div>`:`<div class="box c">${t('fare')}: <b>${money(q.estFare)} ${t('qar')}</b> · ${t('cashOnly')}</div>`}
    ${q.status!=='started'?`<button class="btn o" onclick="cancelReq()">${t('cancel')}</button>`:''}`;
    loadDrvInfo(q.driverId);return;
  }
  if(r.phase==='done'){
    el.innerHTML=`<div class="grab"></div><h3 class="c">🎉 ${t('done')}</h3>
    <div class="box c"><div class="mut">${t('payCash')}</div><div class="meter">${money(q.fare)} ${t('qar')}</div><div class="mut sm">${(+q.km||0).toFixed(2)} ${t('km')}</div></div>
    <h4 class="c">${t('rate')}</h4><div class="stars" id="stars">${[1,2,3,4,5].map(i=>`<span data-i="${i}" class="${r.stars>=i?'on':''}" onclick="setStar(${i})">★</span>`).join('')}</div>
    <button class="btn" onclick="submitRating()">${r.stars?t('submit'):t('skip')}</button>`;
  }
}
async function loadDrvInfo(id){
  const u={rSum:await DB.get('profiles/'+id+'/rSum'),rCount:await DB.get('profiles/'+id+'/rCount')};const e=$('#drat');if(e)e.textContent=starsTxt(u);
  getPhoto(id).then(s=>document.querySelectorAll(`img[data-uid="${CSS.escape(id)}"]`).forEach(i=>i.src=s));
}
async function getPhoto(id){if(photoCache[id])return photoCache[id];try{const p=await DB.get('profiles/'+id+'/photo');photoCache[id]=p||PH}catch(e){photoCache[id]=PH}return photoCache[id]}
function renderPlan(){
  const el=$('#plan');if(!el)return;const r=S.rider;
  if(!r.pickup||!r.dest){el.innerHTML=`<p class="c mut sm">${t('tapMap')}</p>`;return}
  if(r.loading){el.innerHTML='<div class="spin"></div>';return}
  if(!r.route){el.innerHTML='';return}
  el.innerHTML=`<div class="row"><div class="kpi"><b>${r.route.km.toFixed(1)}</b>${t('km')}</div><div class="kpi"><b>${r.route.min}</b>${t('min')}</div><div class="kpi"><b>${r.route.approx?'≈':''}${money(r.fare)}</b>${t('qar')}</div></div>
  <p class="c sm mut" style="margin:6px 0">💵 ${t('cashOnly')}</p><div id="drv"></div>`;
  renderDrivers();
}
function renderDrivers(){
  const el=$('#drv');if(!el)return;const r=S.rider;if(!r.route){el.innerHTML='';return}
  let h=`<h4>${t('nearby')}</h4>`;
  if(!r.drivers.length)h+=`<p class="c mut sm">${t('noDrivers')}</p>`;
  else h+=r.drivers.map(d=>`<div class="drv ${d.id===r.sel?'sel':''}" onclick="selDrv('${esc(d.id)}')"><img data-uid="${esc(d.id)}" src="${photoCache[d.id]||PH}"><div style="flex:1;min-width:0"><b>${esc(d.name)}</b><div class="mut sm">${d.rc?'★ '+(+d.rating).toFixed(1)+' ('+d.rc+')':t('newRider')}</div><div class="mut sm">${esc(d.model||'')} · ${esc(d.plate||'')}</div></div><div class="c"><b>${d.dist.toFixed(1)} ${t('km')}</b><div class="mut sm">~${Math.max(1,Math.round(d.dist/35*60))} ${t('min')}</div></div></div>`).join('');
  h+=`<button class="btn" ${r.sel?'':'disabled'} onclick="sendRequest()">${t('request')} · ${money(r.fare)} ${t('qar')}</button>`;
  el.innerHTML=h;
  r.drivers.forEach(d=>{if(!photoCache[d.id])getPhoto(d.id).then(s=>document.querySelectorAll(`img[data-uid="${CSS.escape(d.id)}"]`).forEach(i=>i.src=s))});
}
function selDrv(id){S.rider.sel=id;renderDrivers()}
function drawDriverMarkers(){
  M.drv.clearLayers();
  S.rider.drivers.forEach(d=>{L.marker([d.lat,d.lng],{icon:IC('🚖','car')}).on('click',()=>selDrv(d.id)).addTo(M.drv)});
}
let qT;
function onQ(v){S.rider.qtext=v;clearTimeout(qT);if(v.trim().length<2){$('#res').innerHTML='';return}qT=setTimeout(()=>doSearch(v.trim()),500)}
async function doSearch(v){
  try{
    const j=await(await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=${C.code}&accept-language=${lang}&q=${encodeURIComponent(v)}`)).json();
    S.rider.results=j;const e=$('#res');if(e)e.innerHTML=j.map((x,i)=>`<div class="rs" onclick="pickRes(${i})">📍 ${esc(shortName(x.display_name))}</div>`).join('');
  }catch(e){}
}
function pickRes(i){const x=S.rider.results[i];if(!x)return;const n=shortName(x.display_name);S.rider.qtext=n;$('#res').innerHTML='';$('#q').value=n;setPoint('dest',+x.lat,+x.lon,n);M.map.setView([+x.lat,+x.lon],15)}
function pickMode(w){S.rider.pickMode=w;const b=$('#pickb');b.hidden=false;b.textContent='👆 '+t('tapMap')}
function mapPick(p){
  if(!inQ(p.lat,p.lng))return toast(t('outQatar'));
  const r=S.rider,w=r.pickMode||'dest';r.pickMode=null;$('#pickb').hidden=true;setPoint(w,p.lat,p.lng);
}
function useMyLoc(){if(S.pos&&inQ(S.pos.lat,S.pos.lng)){setPoint('pickup',S.pos.lat,S.pos.lng);M.map.setView([S.pos.lat,S.pos.lng],15)}else toast(t('noGps'))}
async function setPoint(w,lat,lng,name){
  const r=S.rider;r[w]={lat,lng,name:name||'…'};drawPts();refreshFields();
  if(!name){const n=await rev(lat,lng);if(r[w]&&r[w].lat===lat&&r[w].lng===lng){r[w].name=n;if(w==='dest')r.qtext=n;refreshFields()}}
  if(r.pickup&&r.dest&&r.phase==='plan')computeRoute();
}
function refreshFields(){
  const r=S.rider,pk=$('#pk');if(pk)pk.textContent=r.pickup?r.pickup.name:t('pickup')+' — '+t('tapMap');
  const q=$('#q');if(q&&document.activeElement!==q&&r.dest)q.value=r.dest.name;
}
function drawPts(){const r=S.rider;r.pickup?setMk('pick',[r.pickup.lat,r.pickup.lng],IC('🟢','pk')):rmMk('pick');r.dest?setMk('dst',[r.dest.lat,r.dest.lng],IC('🏁','ds')):rmMk('dst')}
async function computeRoute(){
  const r=S.rider;r.loading=true;r.route=null;renderPlan();
  const a=r.pickup,b=r.dest,x=await route(a,b);
  if(r.pickup!==a||r.dest!==b)return;
  r.loading=false;r.route=x;r.fare=calcFare(x.km);drawRoute(x.geom);renderPlan();fit([[a.lat,a.lng],[b.lat,b.lng]]);fetchDrivers();
}
async function fetchDrivers(){
  const r=S.rider;if(!r.pickup||!r.route)return;
  const all=(await DB.get('drivers'))||{},now=Date.now();
  r.drivers=Object.entries(all).map(([id,d])=>({...d,id})).filter(d=>d.online&&!d.busy&&d.lat&&now-d.ts<60000&&d.id!==S.user.id).map(d=>({...d,dist:hav(r.pickup,d)})).filter(d=>d.dist<=CFG.RADIUS_KM).sort((a,b)=>a.dist-b.dist).slice(0,8);
  if(r.sel&&!r.drivers.find(d=>d.id===r.sel))r.sel=null;
  if(!r.sel&&r.drivers[0])r.sel=r.drivers[0].id;
  drawDriverMarkers();renderDrivers();
}
async function sendRequest(){
  const r=S.rider,d=r.drivers.find(x=>x.id===r.sel);if(!d||!r.route)return;
  try{
    const fresh=await DB.get('drivers/'+d.id);if(!fresh||fresh.busy||!fresh.online){toast(t('declined'));return fetchDrivers()}
    const id=uid8(),u=S.user;
    const q={id,riderId:u.id,riderName:u.name,riderPhone:u.phone,driverId:d.id,pickup:r.pickup,dest:r.dest,km:+r.route.km.toFixed(2),min:r.route.min,estFare:r.fare,status:'pending',pay:'cash',createdAt:Date.now()};
    await DB.set('requests/'+id,q);await DB.set('driverReq/'+d.id,id);
    r.req=id;r.q=q;r.phase='wait';localStorage.setItem('activeReq',id);r.sig='';riderSheet();
  }catch(e){toast(t('netErr'))}
}
async function cancelReq(){

function setRPhase(p,q){

async function riderTick(){
  const r=S.rider;
  if(r.phase==='plan'){await fetchDrivers();return}
  if(!r.req||r.phase==='done'||r.phase==='declined')return;
  const q=await DB.get('requests/'+r.req);if(!q){riderBack();return}
  if(q.status==='pending'){
    if(Date.now()-q.createdAt>CFG.REQ_TIMEOUT*1000){await DB.patch('requests/'+q.id,{status:'expired'});localStorage.removeItem('activeReq');setRPhase('declined',q)}
    else r.q=q;return;
  }
  if(['declined','expired','cancelled'].includes(q.status)){localStorage.removeItem('activeReq');setRPhase('declined',q);return}
  if(['accepted','arrived','started'].includes(q.status)){
    setRPhase('active',q);
    if(q.dLat){setMk('car',[q.dLat,q.dLng],IC('🚖','car'));M.drv.clearLayers()}
    if(q.status==='started'){const a=$('#lf'),b=$('#lk');if(a)a.textContent=money(q.fare||q.estFare)+' '+t('qar');if(b)b.textContent=(q.meterKm||0).toFixed(2)+' '+t('km')}
    return;
  }
  if(q.status==='completed'){localStorage.removeItem('activeReq');setRPhase('done',q)}
}

function meterTick(p){
  const m=D.meter;if(!m)return;if(p.acc&&p.acc>80)return;
  if(!m.last){m.last={lat:p.lat,lng:p.lng,ts:p.ts};return}
  const d=hav(m.last,p),dt=(p.ts-m.last.ts)/1000;
  if(d<0.006&&dt<20)return;                                   // تجاهل اهتزاز GPS
  if(dt<30&&dt>0&&d/(dt/3600)>220)return;                     // قفزة غير منطقية
  if(dt>40&&d>0.15){                                          // غاب التطبيق (الملاحة في تطبيق آخر): مسافة الطريق الفعلية بين آخر نقطة والحالية
    const from=m.last;m.last={lat:p.lat,lng:p.lng,ts:p.ts};m.samples++;m.pending=(m.pending||0)+1;
    route(from,p).then(x=>{m.km+=x.km;m.pending--;updateMeterUI()}).catch(()=>{m.km+=d*1.3;m.pending--;updateMeterUI()});
    return;
  }
  m.km+=d;
  m.last={lat:p.lat,lng:p.lng,ts:p.ts};m.samples++;updateMeterUI();
}
async function endTrip(){
  const m=D.meter,q=D.q;
  const eb=document.querySelector('#sheet .btn.r');if(eb){eb.disabled=true;eb.textContent='…'}
  const fp=await freshPos();if(fp&&D.phase==='started')meterTick(fp);
  for(let i=0;i<20&&m.pending>0;i++)await new Promise(r=>setTimeout(r,200));
  let km=q.km;const end=S.pos;                                 // وصل للوجهة: السعر المتفق عليه (أقصر طريق)
  if(end&&m.start&&hav(end,q.dest)>0.3)km=(await route(m.start,end)).km;   // أنهى قبل/بعد الوجهة: أقصر طريق بين البداية والنهاية الفعلية
  km=Math.max(km,0.1);const fare=calcFare(km),comm=+(fare*CFG.COMMISSION).toFixed(2),u=S.user;
  const tr={id:q.id,ts:Date.now(),fare,comm,km:+km.toFixed(2),kmDriven:+(m.km||0).toFixed(2),rName:q.riderName,rPhone:q.riderPhone,from:q.pickup.name,to:q.dest.name,dName:u.name,dPhone:u.phone,dEmail:u.email,cur:C.cur,cc:C.code,settled:false,reported:false};
  D.trip=tr;D.phase='ended';saveDrv();unwake();drvSheet();
  reportTrip(tr);                                             // يفتح واتساب المدير برسالة جاهزة
  try{
    await DB.patch('requests/'+q.id,{status:'completed',fare,km:tr.km,endedAt:tr.ts});
    await DB.set(`trips/${u.id}/${q.id}`,tr);await DB.patch('drivers/'+u.id,{busy:false});
  }catch(e){toast(t('netErr'))}
  D.req=null;saveDrv();loadStats();
}
async function driverTick(){
  const u=S.user;await pushLoc();
  if(D.phase==='ended')return;
  if(D.req){
    const q=await DB.get('requests/'+D.req);if(!q){resetDrv();return}D.q=q;
    if(q.status==='cancelled'){toast(t('riderCancelled'));resetDrv();return}
    if(S.pos){const x={dLat:S.pos.lat,dLng:S.pos.lng};if(D.phase==='started'&&D.meter){x.meterKm=+D.meter.km.toFixed(3);saveDrv()}await DB.patch('requests/'+D.req,x)}

  if(D.phase==='incoming'){
    const q=await DB.get('requests/'+D.inc.id);
    if(!q||q.status!=='pending'||Date.now()-q.createdAt>CFG.REQ_TIMEOUT*1000){D.inc=null;D.phase='idle';clearMap();drvSheet()}return;
  }
  if(D.online&&S.mode==='drive'){
    const rid=await DB.get('driverReq/'+u.id);if(!rid)return;
    const q=await DB.get('requests/'+rid);
    if(q&&q.status==='pending'&&Date.now()-q.createdAt<CFG.REQ_TIMEOUT*1000){D.inc=q;D.phase='incoming';beep();drvSheet();showIncomingMap(q)}

}

  <a class="btn wa" style="text-decoration:none" target="_blank" href="${waLink(CFG.ADMIN_WA,'')}">💬 ${t('contactAdmin')} +${CFG.ADMIN_WA}</a>
  <button class="btn o" id="adminBtn" hidden onclick="adminShow()">🔐 ${t('admin')}</button>
  <button class="btn r" onclick="logout()">${t('logout')}</button>`);
  DB.get('admins/'+u.id).then(v=>{const b=$('#adminBtn');if(v&&b)b.hidden=false}).catch(()=>{});
}
async function profPhoto(inp,k,img){if(!inp.files[0])return;PP[k]=await readImg(inp.files[0]);$('#'+img).src=PP[k]}
async function saveProfile(){
  const u=S.user,name=$('#p_name').value.trim(),phone=normPhone($('#p_phone').value),perr=m=>$('#perr').textContent=m;
  if(!name)return perr(t('fillAll'));if(!phone)return perr(t('badPhone'));
  const p={name,phone};if(PP.photo)p.photo=PP.photo;
  if(u.isDriver||!$('#dform').hidden){
    const plate=$('#p_plate').value.trim().toUpperCase(),car=PP.carPhoto||u.carPhoto,me=PP.photo||u.photo;
    if(!plate||!car||!me)return perr(t('fillAll'));
    Object.assign(p,{isDriver:true,plate,model:$('#p_model').value.trim(),carPhoto:car});
  }
  try{
    const up={phone:p.phone};if('isDriver' in p)up.isDriver=true;const pp={...p};delete pp.phone;delete pp.isDriver;await DB.patch('users/'+u.id,up);await DB.patch('profiles/'+u.id,pp);Object.assign(S.user,p);photoCache[u.id]=S.user.photo;
    if(p.isDriver&&D.online)await pushLoc();
    closeModal();renderTop();renderSheet();if(p.isDriver)loadStats();
  }catch(e){perr(t('netErr'))}
}

/* =====================  لوحة المدير  ===================== */
async function adminShow(){
  const trips=(await DB.get('trips'))||{};let rows='',tot={},rep='📊 التقرير الأسبوعي لعمولات السائقين (15%)\n';
  Object.entries(trips).forEach(([did,o])=>{
    const a=Object.values(o),dueO=sumCur(a.filter(x=>!x.settled),'comm'),has=anyPos(dueO);tot=mergeCur(tot,dueO);const f=a[a.length-1];
    if(has)rep+=`\n👤 ${f.dName}\n✉️ ${f.dEmail||did.replace(/,/g,'.')}\n💬 +${f.dPhone}\n💰 ${fmtCur(dueO,true)}\n`;
    rows+=`<div class="box"><b>${esc(f.dName)}</b> · +${esc(f.dPhone)}<br>✉️ ${esc(f.dEmail||did.replace(/,/g,'.'))}<br>${t('trips')}: ${a.length} · ${t('earned')}: ${esc(fmtCur(sumCur(a,'fare')))}<br>${t('due')}: <b style="color:var(--m)">${esc(fmtCur(dueO))}</b>
    <div class="row" style="margin-top:6px"><a class="btn s wa" style="flex:1;text-decoration:none" target="_blank" href="${waLink(f.dPhone,'تذكير: المطلوب منك عمولة التطبيق 15% بقيمة '+fmtCur(dueO,true)+'. أرجو الدفع.')}">${t('remind')}</a><button class="btn s g" style="flex:1" ${has?'':'disabled'} onclick="settle('${esc(did)}')">${t('settle')}</button></div></div>`;
  });
  rep+=`\nالإجمالي المطلوب: ${fmtCur(tot,true)}`;
  openModal(`<h3>🔐 ${t('admin')}</h3><div class="due"><div>${t('due')}</div><b>${esc(fmtCur(tot))}</b></div><a class="btn wa" style="text-decoration:none" target="_blank" href="${waLink(CFG.ADMIN_WA,rep)}">📊 ${t('adminWeekly')}</a>${rows||`<p class="c mut">${t('noData')}</p>`}`);
}
async function settle(did){
  const o=(await DB.get('trips/'+did))||{},p={};
  Object.entries(o).forEach(([id,x])=>{if(!x.settled){p[id+'/settled']=true;p[id+'/settledAt']=Date.now()}});
  await DB.patch('trips/'+did,p);adminShow();
}

/* =====================  بدء التشغيل  ===================== */
(async function boot(){
  applyLang();
  if(AUTH.ref){
    try{await fbRefresh();const u=await loadUser(AUTH.uid);if(u){S.user=u;S.mode=u.isDriver&&localStorage.getItem('mode')==='drive'?'drive':'ride';return enter()}}catch(e){}
  }
  authView();
})();
</script>
